[package]
name    = "engine"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "fs", "signal"] }
axum               = "0.7"
tower-http         = { version = "0.5", features = ["cors", "fs"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
prost              = "0.13"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zstd               = "0.13"
brotli             = "7"
xz2                = "0.1"
bzip2              = "0.4"
flate2             = "1"
lz4_flex           = "0.11"

blake3             = "1"
hex                = "0.4"
infer              = "0.16"
phf                = { version = "0.11", features = ["macros"] }
percent-encoding   = "2.3"
uuid               = { version = "1", features = ["v4"] }

rayon              = "1.10"
dashmap            = "6"
parking_lot        = "0.12"
num_cpus           = "1.17"
mimalloc           = "0.1.48"

sled               = "0.34.7"
sqlx               = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros"] }
redis              = { version = "1.0.4", features = ["tokio-comp", "tokio-rustls-comp"] }

notify             = "6.1.1"
crossbeam-channel  = "0.5.11"
walkdir            = "2.5"
sysinfo            = "0.33"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[build-dependencies]
prost-build         = "0.13"
protoc-bin-vendored = "3"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
