[package]
name    = "engine"
version = "0.3.0"
edition = "2021"

[features]
default = []

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
axum               = { version = "0.7", features = ["multipart"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http         = { version = "0.5", features = ["cors", "fs", "set-status"] }
bytes              = "1"
humansize          = "2"
prost              = "0.13"
infer              = "0.16"
zstd               = "0.13"
rayon              = "1.10"
lz4_flex           = "0.11"
blake3             = "1"
dashmap            = "6"
parking_lot        = "0.12"
phf                = { version = "0.11", features = ["macros"] }
mimalloc = "0.1.48"
futures = "0.3.32"
num_cpus = "1.17.0"
redis = { version = "1.0.4", features = ["tokio-comp", "tokio-rustls-comp"] }
sysinfo = "0.33"
notify = "6.1.1"
crossbeam-channel = "0.5.11"
sled = "0.34.7"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros"] }
hex = "0.4.3"
walkdir = "2.5.0"
percent-encoding = "2.3"

[dev-dependencies]
criterion          = "0.5"

[build-dependencies]
prost-build = "0.13"

# Optimizations for datacenter deployment
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.bench]
inherits = "release"
