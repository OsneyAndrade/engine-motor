services:
  postgres:
    image: postgres:16-alpine
    container_name: syntra-postgres-prod
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: syntra_monitoring
      PGDATA: /var/lib/postgresql/data/pgdata
    expose: ["5432"]
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [syntra-prod-network]
    restart: always

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syntra-engine-prod
    environment:
      SYNTRA_DB_URL: postgres://syntra:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/syntra_monitoring

      SYNTRA_VAULT_PATH: /data/essence_vault
      SYNTRA_SLED_INDEX: /data/metadata_index.sled
      SYNTRA_DICT_PATH: /data/dictionaries
      SYNTRA_WATCH_DIR: /data/watch_in

      SYNTRA_BIND_ADDR: 0.0.0.0:3002
      SYNTRA_MAX_BODY_MB: 10240

      SYNTRA_DEFAULT_EFFORT: balanced
      SYNTRA_VERIFY_ON_WRITE: "true"
      SYNTRA_DICTIONARIES: "true"

      SYNTRA_API_KEYS: ${SYNTRA_API_KEYS:?defina SYNTRA_API_KEYS}
      SYNTRA_CORS_ORIGINS: ${SYNTRA_CORS_ORIGINS:-}

      SYNTRA_WATCH_ENABLED: "false"

      RAYON_NUM_THREADS: ""
      SYNTRA_COMPRESS_MULTIPLIER: 4
      RUST_LOG: engine=info,tower_http=warn
    ports:
      - "3002:3002"
    volumes:
      - syntra_data_prod:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [syntra-prod-network]
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3002/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_prod_data:
    name: syntra_postgres_prod_data
  syntra_data_prod:
    name: syntra_data_prod

networks:
  syntra-prod-network:
    name: syntra-prod-network
    driver: bridge
