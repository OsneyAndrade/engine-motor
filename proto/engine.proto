syntax = "proto3";
package engine;

enum Algorithm {
  AUTO          = 0;
  ZSTD_FAST     = 1;
  ZSTD_BALANCED = 2;
  ZSTD_MAX      = 3;
  LZ4           = 4;
  PASSTHROUGH   = 5;
}

enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_STORED      = 1;
  CODEC_LZ4         = 2;
  CODEC_ZSTD        = 3;
  CODEC_BROTLI      = 4;
  CODEC_XZ          = 5;
  CODEC_BZIP2       = 6;
  CODEC_DEFLATE     = 7;
}

enum Transform {
  TRANSFORM_UNSPECIFIED  = 0;
  TRANSFORM_DELTA        = 1;
  TRANSFORM_BYTE_SPLIT   = 2;
  TRANSFORM_RLE          = 3;
  TRANSFORM_CSV_COLUMNAR = 4;
}

message TransformStep {
  int32  transform = 1;
  uint32 width     = 2;
  uint64 input_len = 3;
}

message DictionaryRef {
  string id     = 1;
  bytes  digest = 2;
  uint32 size   = 3;
}

message Block {
  bytes  data         = 1;
  int32  algorithm    = 2;
  bytes  hash         = 3;
  bool   deduplicated = 4;
  uint32 original_len = 5;
  int32  codec        = 6;
  int32  codec_level  = 7;
}

message ProcessedFile {
  int32           version        = 1;
  string          original_name  = 2;
  repeated string original_names = 15;
  string          original_mime  = 3;
  uint64          original_size  = 4;
  uint64          processed_size = 5;
  float           savings_pct    = 6;

  int32  algorithm         = 7;
  int32  compression_level = 8;
  string dictionary_id     = 9;

  bytes          data   = 10;
  repeated Block blocks = 11;

  FileMetrics file_metrics = 12;

  string pointer_to = 13;
  bytes  file_hash  = 14;

  uint32 ref_count         = 16;
  uint64 envelope_checksum = 17;
  int64  created_at        = 18;
  int64  updated_at        = 19;

  int32                  codec         = 20;
  int32                  codec_level   = 21;
  repeated TransformStep transforms    = 22;
  DictionaryRef          dictionary    = 23;
  string                 content_class = 24;
  string                 plan_reason   = 25;
  bool                   verified      = 26;
}

message FileMetrics {
  double throughput_mbps     = 1;
  double compression_ratio   = 2;
  uint64 dedup_savings_bytes = 3;
  double processing_time_ms  = 4;
  string algorithm_used      = 5;
  string strategy_reason     = 6;
  uint32 candidates_tried    = 7;
  double reconstruct_ms      = 8;
}
