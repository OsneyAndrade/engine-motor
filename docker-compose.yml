services:
  postgres:
    image: postgres:16-alpine
    container_name: ${SYNTRA_CONTAINER_PREFIX:-syntra}-postgres
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: syntra123
      POSTGRES_DB: syntra_monitoring
    ports:
      - "127.0.0.1:${SYNTRA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [syntra-network]

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SYNTRA_CONTAINER_PREFIX:-syntra}-engine
    environment:
      SYNTRA_DB_URL: postgres://syntra:syntra123@postgres:5432/syntra_monitoring

      SYNTRA_VAULT_PATH: /data/essence_vault
      SYNTRA_SLED_INDEX: /data/metadata_index.sled
      SYNTRA_DICT_PATH: /data/dictionaries
      SYNTRA_WATCH_DIR: /data/watch_in

      SYNTRA_BIND_ADDR: 0.0.0.0:3002
      SYNTRA_MAX_BODY_MB: 4096
      SYNTRA_MAX_DECOMPRESSED_MB: ${SYNTRA_MAX_DECOMPRESSED_MB:-}

      SYNTRA_DEFAULT_EFFORT: max
      SYNTRA_VERIFY_ON_WRITE: "true"
      SYNTRA_DICTIONARIES: "true"

      RAYON_NUM_THREADS: ""
      SYNTRA_COMPRESS_MULTIPLIER: 4
      RUST_LOG: engine=debug,tower_http=info
    ports:
      - "${SYNTRA_PUBLISH_HOST:-127.0.0.1}:${SYNTRA_PUBLISH_PORT:-3002}:3002"
    volumes:
      - syntra_data_dev:/data
      - type: bind
        source: ${SYNTRA_WATCH_HOST_DIR:-./watch_in}
        target: /data/watch_in
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [syntra-network]
    restart: unless-stopped

volumes:
  postgres_data:
  syntra_data_dev:

networks:
  syntra-network:
    driver: bridge
